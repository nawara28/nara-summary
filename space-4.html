<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="나라장터 공고 하나의 요약 — 제목·기관·금액·마감, 첨부파일 요약, 참가 자격요건을 한 페이지로." />
    <link rel="icon" href="data:," />
    <title>나라장터 공고 요약</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&display=swap" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #edf3f6;
        --surface: #ffffff;
        --surface-2: #dfe9ee;
        --text: #10243e;
        --dim: #5a6b78;
        --border: #c8d6dd;
        --accent: #007f79;
        --accent-ink: #ffffff;
        --amber: #e39a20;
        --danger: #a84236;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1725;
          --surface: #122438;
          --surface-2: #1c3348;
          --text: #f2f7f9;
          --dim: #9eb0bc;
          --border: #2b465d;
          --accent: #35b9ad;
          --accent-ink: #071a1b;
          --amber: #f2b64f;
          --danger: #ff8b7c;
        }
      }
      * { box-sizing: border-box; }
      html { background: var(--bg); }
      body {
        margin: 0;
        font-family: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        -webkit-font-smoothing: antialiased;
      }
      a { -webkit-tap-highlight-color: transparent; }
      a:focus-visible, button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 35%, transparent); outline-offset: 2px; }
      .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }

      main { width: min(100%, 760px); margin: 0 auto; padding: 22px 16px calc(48px + env(safe-area-inset-bottom)); }

      .page-label {
        margin: 0 0 14px;
        color: var(--accent);
        font: 700 11px/1.3 "IBM Plex Mono", ui-monospace, monospace;
        letter-spacing: .14em;
      }

      /* 연결된 발주계획 체인 (스크레이퍼 카드와 같은 구조) */
      .chain { display: grid; grid-template-columns: 36px 1fr; gap: 0 10px; margin-bottom: 18px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
      .chain-node { width: 36px; height: 25px; display: grid; place-items: center; border-radius: 5px; font-size: 10px; font-weight: 850; }
      .plan-node { background: color-mix(in srgb, var(--amber) 20%, transparent); color: var(--text); }
      .bid-node { grid-row: 3; background: var(--accent); color: var(--accent-ink); }
      .chain-copy { min-width: 0; }
      .chain-title { display: block; color: var(--text); font-size: 14px; line-height: 1.45; font-weight: 750; text-decoration: none; }
      .chain-title:hover { text-decoration: underline; text-underline-offset: 3px; }
      .chain-copy span { display: block; margin-top: 4px; color: var(--dim); font-size: 12px; }
      .chain-line { grid-column: 1; height: 17px; margin-left: 17px; border-left: 2px solid var(--accent); }

      .notice-topline { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
      .kind-badge { padding: 4px 7px; border-radius: 5px; font-size: 11px; font-weight: 800; }
      .kind-badge.bid { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
      .kind-badge.plan { background: color-mix(in srgb, var(--amber) 18%, transparent); color: color-mix(in srgb, var(--amber) 70%, var(--text)); }
      .topic-label { color: var(--dim); font-size: 12px; font-weight: 700; }
      .dday { margin-left: auto; padding: 4px 8px; border-radius: 5px; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 850; }
      .dday.urgent { background: var(--danger); color: #fff; }
      .dday.passed { background: var(--surface-2); color: var(--dim); }

      h1.title { margin: 12px 0 5px; font-size: clamp(21px, 5.4vw, 27px); line-height: 1.38; letter-spacing: -.02em; word-break: keep-all; overflow-wrap: anywhere; }
      .agency { margin: 0 0 14px; color: var(--dim); font-size: 14px; }

      .facts { margin: 0; display: grid; gap: 8px; }
      .facts div { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 8px; font-size: 14px; }
      .facts dt { color: var(--dim); }
      .facts dd { margin: 0; overflow-wrap: anywhere; font-weight: 600; }
      .facts dd.mono { font-weight: 500; font-size: 13px; }

      .relation-note { margin: 15px 0 0; padding-top: 11px; border-top: 1px dashed var(--border); color: var(--accent); font-size: 12.5px; line-height: 1.55; }
      .excerpt { margin: 14px 0 0; color: var(--dim); font-size: 14px; line-height: 1.65; }

      .document-analysis { display: grid; gap: 20px; margin-top: 20px; padding-top: 17px; border-top: 1px solid var(--border); }
      .document-analysis section { min-width: 0; }
      .document-analysis h2 { margin: 0 0 8px; color: var(--accent); font-size: 13px; letter-spacing: .01em; }
      .document-analysis section.qualification h2 { color: var(--text); }
      .document-analysis p { margin: 0; font-size: 14px; line-height: 1.7; white-space: pre-line; overflow-wrap: anywhere; }

      .summary-facets { display: grid; gap: 7px; margin: 12px 0 0; }
      .summary-facets div { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 8px; font-size: 12px; line-height: 1.55; }
      .summary-facets dt { color: var(--dim); }
      .summary-facets dd { margin: 0; font-weight: 650; overflow-wrap: anywhere; }

      .attachment-links { display: flex; flex-wrap: wrap; gap: 7px 14px; margin-top: 12px; }
      .attachment-links a { color: var(--dim); font-size: 12px; font-weight: 700; text-underline-offset: 3px; overflow-wrap: anywhere; }
      .attachment-links a:hover { color: var(--text); }

      .tag-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
      .tag-list span { padding: 4px 7px; border-radius: 5px; background: var(--surface-2); color: var(--dim); font-size: 11px; font-weight: 750; }

      .source-url-box { display: flex; gap: 8px; align-items: flex-start; margin-top: 20px; padding: 10px 11px; border-radius: 8px; background: var(--surface-2); }
      .source-url-label { flex-shrink: 0; padding: 2px 6px; border-radius: 4px; background: var(--bg); color: var(--accent); font: 800 10px/1.4 "IBM Plex Mono", ui-monospace, monospace; letter-spacing: .06em; }
      .source-url-text { min-width: 0; color: var(--dim); font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; word-break: break-all; text-decoration: none; user-select: all; }
      .source-url-text:hover { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }

      .notice-actions { display: flex; align-items: center; margin-top: 14px; }
      .source-link { color: var(--text); text-decoration: none; font-size: 14px; font-weight: 800; border-bottom: 1px solid var(--text); padding-bottom: 1px; }

      /* 이 공고 공유 링크 (랜덤 토큰 주소 생성) */
      .share { margin-top: 24px; padding-top: 17px; border-top: 1px solid var(--border); }
      .share h2 { margin: 0 0 8px; color: var(--accent); font-size: 13px; letter-spacing: .01em; }
      .share-note { margin: 0 0 10px; color: var(--dim); font-size: 12.5px; line-height: 1.6; }
      .share-row { display: flex; gap: 8px; align-items: stretch; }
      .share-link-box { flex: 1; min-width: 0; display: flex; align-items: center; padding: 10px 11px; border-radius: 8px; background: var(--surface-2); color: var(--dim); font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; word-break: break-all; user-select: all; }
      .share-btn { flex-shrink: 0; min-height: 44px; padding: 0 16px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); font: inherit; font-size: 13px; font-weight: 800; cursor: pointer; -webkit-tap-highlight-color: transparent; }
      .share-btn:active { transform: translateY(1px); }
      @media (max-width: 480px) {
        .share-row { flex-direction: column; }
        .share-btn { width: 100%; }
      }

      .provenance { margin: 26px 0 0; padding-top: 14px; border-top: 1px solid var(--border); color: var(--dim); font-size: 12px; line-height: 1.6; }

      /* 빈 상태 / 오류 상태 */
      .empty { min-height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 0; }
      .empty-mark { font: 800 54px/1 "IBM Plex Mono", ui-monospace, monospace; color: var(--border); }
      .empty h1 { margin: 14px 0 6px; font-size: 20px; letter-spacing: -.02em; }
      .empty p { margin: 0; max-width: 420px; color: var(--dim); font-size: 14px; line-height: 1.65; }

      @media (min-width: 680px) {
        main { padding-inline: 24px; }
      }
      @media print {
        body { background: #fff; }
        main { padding: 0; }
        .share { display: none; }
      }
    </style>
  </head>
  <body>
    <main id="app">
      <div class="empty" id="loading">
        <div class="empty-mark">···</div>
        <p>공고 요약을 불러오는 중입니다.</p>
      </div>
    </main>

    <script>
      (function () {
        "use strict";

        var app = document.getElementById("app");

        /* ---------- 링크에서 공고 데이터 읽기 ----------
           링크 형식:
           (1) 랜덤 공유 링크: #/p/<랜덤 토큰>/<base64url(JSON)> — 이 페이지의
               '랜덤 링크 만들기' 버튼이 생성하는 기본 형식. 토큰은 공고번호와
               무관하게 매번 새로 뽑는 추측 불가능한 값이라, 주소만으로 어떤
               공고인지 예측할 수 없다.
           (2) 기존 형식: #d=<base64url(JSON)> 또는 ?d=<base64url(JSON)>
           JSON 필드(스크레이퍼 공고와 동일):
           kind("bid"|"plan"), topic, title, agency, noticeNumber, amountText,
           postedAt, deadlineAt, sourceUrl, sourceName, excerpt,
           attachmentSummary, qualificationRequirements,
           attachmentReferences[{name,url}],
           summaryFacets{scopeItems[],deliverables[],technologies[],qualificationTags[]},
           relationNote, relatedPlan{title,agency,amountText,postedAt,sourceUrl,sourceName} */
        function decodePayload(raw) {
          try {
            var b64 = decodeURIComponent(raw).replace(/-/g, "+").replace(/_/g, "/");
            while (b64.length % 4) b64 += "=";
            var bin = atob(b64);
            var bytes = new Uint8Array(bin.length);
            for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            var obj = JSON.parse(new TextDecoder("utf-8").decode(bytes));
            if (!obj || typeof obj !== "object" || typeof obj.title !== "string" || !obj.title) return null;
            return obj;
          } catch (e) {
            return null;
          }
        }

        /* 해시 문자열에서 페이로드 추출: #/p/<토큰>/<페이로드> 우선, 없으면 #d= 구형식 */
        function hashPayload(hash) {
          if (!hash) return null;
          var pm = hash.match(/^#\/p\/[A-Za-z0-9_-]{8,}\/(.+)$/);
          if (pm) return pm[1];
          var m = hash.match(/[#&]d=([^&]+)/);
          if (m) return m[1];
          return null;
        }
        /* 쿼리 문자열(?...)에서 d 파라미터 추출 */
        function searchPayload(search) {
          if (!search) return null;
          try { return new URLSearchParams(search).get("d"); } catch (e) { return null; }
        }
        /* 최상위 문서의 location 값 읽기.
           공유 주소로 열면 이 페이지는 iframe 안에서 렌더링되고, 프래그먼트는
           서버로 전송되지 않아 iframe 주소에 실리지 않는다 — 페이로드는 최상위
           문서 주소에만 있다. same-origin이면 읽을 수 있고, cross-origin이면
           SecurityError가 나므로 조용히 빈 문자열로 처리한다. */
        function topLocationValue(prop) {
          try {
            if (window.top && window.top !== window.self) return window.top.location[prop] || "";
          } catch (e) { /* cross-origin: 읽을 수 없으면 건너뜀 */ }
          return "";
        }

        function readPayload() {
          var raw = null;
          try {
            /* 1) 이 문서의 해시 */
            raw = hashPayload(window.location.hash || "");
            /* 2) iframe 안이면 최상위 문서의 해시 */
            if (!raw) raw = hashPayload(topLocationValue("hash"));
            /* 3) 이 문서의 ?d= (구버전 호환) */
            if (!raw) raw = searchPayload(window.location.search || "");
            /* 4) 최상위 문서의 ?d= */
            if (!raw) raw = searchPayload(topLocationValue("search"));
          } catch (e) { /* 주소 파싱 실패는 빈 상태로 */ }
          if (!raw) return null;
          return decodePayload(raw);
        }

        /* ---------- 랜덤 공유 링크 만들기 ----------
           토큰은 crypto 난수 16바이트를 base64url로 인코딩한 값 — 공고번호나
           제목에서 파생되지 않으므로 다음 공고의 주소를 추측할 수 없다. */
        function encodePayload(obj) {
          var bytes = new TextEncoder().encode(JSON.stringify(obj));
          var bin = "";
          for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
          return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
        }
        function randomToken() {
          var bytes = new Uint8Array(16);
          if (window.crypto && typeof crypto.getRandomValues === "function") {
            crypto.getRandomValues(bytes);
          } else {
            for (var i = 0; i < bytes.length; i++) bytes[i] = Math.floor(Math.random() * 256);
          }
          var bin = "";
          for (var j = 0; j < bytes.length; j++) bin += String.fromCharCode(bytes[j]);
          return btoa(bin).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
        }
        function buildShareLink(obj) {
          var base = window.location.origin + window.location.pathname;
          return base + "#/p/" + randomToken() + "/" + encodePayload(obj);
        }
        function copyText(text, done) {
          function fallback() {
            try {
              var ta = document.createElement("textarea");
              ta.value = text;
              ta.setAttribute("readonly", "");
              ta.style.position = "fixed";
              ta.style.opacity = "0";
              document.body.appendChild(ta);
              ta.select();
              document.execCommand("copy");
              document.body.removeChild(ta);
            } catch (e) { /* 복사 실패 시 링크 박스에서 직접 복사 가능 */ }
            done();
          }
          if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
            navigator.clipboard.writeText(text).then(done, fallback);
          } else {
            fallback();
          }
        }

        /* ---------- 안전한 렌더링 헬퍼 (링크 데이터는 텍스트로만 삽입) ---------- */
        function el(tag, cls, text) {
          var node = document.createElement(tag);
          if (cls) node.className = cls;
          if (text != null) node.textContent = text;
          return node;
        }
        function safeUrl(u) {
          if (typeof u !== "string" || !u) return null;
          try {
            var parsed = new URL(u);
            if (parsed.protocol === "http:" || parsed.protocol === "https:") return u;
          } catch (e) { /* 무시 */ }
          return null;
        }
        function str(v) { return typeof v === "string" && v.trim() ? v : null; }
        function arr(v) { return Array.isArray(v) ? v.filter(function (x) { return typeof x === "string" && x.trim(); }) : []; }

        function deadlineBadge(deadlineAt) {
          if (!deadlineAt) return null;
          var m = String(deadlineAt).match(/(\d{4})-(\d{2})-(\d{2})/);
          if (!m) return null;
          var due = new Date(+m[1], +m[2] - 1, +m[3]);
          var now = new Date();
          var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
          var days = Math.round((due - today) / 86400000);
          var badge = el("span", "dday");
          if (days < 0) { badge.className += " passed"; badge.textContent = "마감 지남"; }
          else if (days === 0) { badge.className += " urgent"; badge.textContent = "오늘 마감"; }
          else { badge.textContent = "마감 D-" + days; if (days <= 3) badge.className += " urgent"; }
          return badge;
        }

        function factsRow(label, value, mono) {
          var wrap = el("div");
          wrap.appendChild(el("dt", null, label));
          var dd = el("dd", mono ? "mono" : null, value);
          wrap.appendChild(dd);
          return wrap;
        }

        function renderNotice(n) {
          var main = el("main");
          main.appendChild(el("p", "page-label", "공유받은 공고 요약 · NARAJANGTEO SUMMARY"));

          var kind = n.kind === "plan" ? "plan" : "bid";
          var kindLabel = kind === "bid" ? "입찰" : "발주";

          /* 연결된 발주계획 체인 */
          var plan = n.relatedPlan && typeof n.relatedPlan === "object" ? n.relatedPlan : null;
          if (plan && str(plan.title)) {
            var chain = el("div", "chain");
            chain.setAttribute("aria-label", "연결된 발주계획");
            chain.appendChild(el("div", "chain-node plan-node", "발주"));
            var copy = el("div", "chain-copy");
            var planUrl = safeUrl(plan.sourceUrl);
            var planTitle;
            if (planUrl) {
              planTitle = el("a", "chain-title", plan.title);
              planTitle.href = planUrl;
              planTitle.target = "_blank";
              planTitle.rel = "noreferrer";
            } else {
              planTitle = el("span", "chain-title", plan.title);
            }
            copy.appendChild(planTitle);
            var planMeta = [str(plan.agency) || "기관 미상", str(plan.postedAt) || "공개일 미상"].join(" · ");
            if (str(plan.amountText)) planMeta += " · " + plan.amountText;
            copy.appendChild(el("span", null, planMeta));
            chain.appendChild(copy);
            var line = el("div", "chain-line");
            line.setAttribute("aria-hidden", "true");
            chain.appendChild(line);
            chain.appendChild(el("div", "chain-node bid-node", kindLabel));
            main.appendChild(chain);
          }

          /* 제목 블록 */
          var topline = el("div", "notice-topline");
          topline.appendChild(el("span", "kind-badge " + kind, kindLabel));
          if (str(n.topic)) topline.appendChild(el("span", "topic-label", n.topic));
          var badge = deadlineBadge(n.deadlineAt);
          if (badge) topline.appendChild(badge);
          main.appendChild(topline);

          main.appendChild(el("h1", "title", n.title));
          main.appendChild(el("p", "agency", str(n.agency) || "기관 정보 없음"));

          var facts = el("dl", "facts");
          if (str(n.noticeNumber)) facts.appendChild(factsRow("공고번호", n.noticeNumber, true));
          if (str(n.amountText)) facts.appendChild(factsRow("금액", n.amountText, false));
          if (str(n.deadlineAt)) facts.appendChild(factsRow("마감", n.deadlineAt, false));
          if (str(n.postedAt)) facts.appendChild(factsRow("공고", n.postedAt, false));
          if (facts.childNodes.length) main.appendChild(facts);

          if (str(n.relationNote)) main.appendChild(el("p", "relation-note", "연결 근거 · " + n.relationNote));
          if (str(n.excerpt)) main.appendChild(el("p", "excerpt", n.excerpt));

          /* 문서 분석: 첨부 요약 + 자격요건 */
          var facets = n.summaryFacets && typeof n.summaryFacets === "object" ? n.summaryFacets : {};
          var scopeItems = arr(facets.scopeItems);
          var deliverables = arr(facets.deliverables);
          var technologies = arr(facets.technologies);
          var qualTags = arr(facets.qualificationTags);
          var files = Array.isArray(n.attachmentReferences) ? n.attachmentReferences : [];

          var analysis = el("div", "document-analysis");

          if (str(n.attachmentSummary)) {
            var sec = el("section");
            sec.appendChild(el("h2", null, "첨부파일 요약"));
            sec.appendChild(el("p", null, n.attachmentSummary));
            if (scopeItems.length || technologies.length || deliverables.length) {
              var dl = el("dl", "summary-facets");
              if (scopeItems.length) {
                var row = el("div");
                row.appendChild(el("dt", null, "주요 과업"));
                row.appendChild(el("dd", null, scopeItems.join(" · ")));
                dl.appendChild(row);
              }
              if (technologies.length) {
                var row2 = el("div");
                row2.appendChild(el("dt", null, "기술·플랫폼"));
                row2.appendChild(el("dd", null, technologies.join(" · ")));
                dl.appendChild(row2);
              }
              if (deliverables.length) {
                var row3 = el("div");
                row3.appendChild(el("dt", null, "주요 산출물"));
                row3.appendChild(el("dd", null, deliverables.join(" · ")));
                dl.appendChild(row3);
              }
              sec.appendChild(dl);
            }
            if (files.length) {
              var links = el("div", "attachment-links");
              links.setAttribute("aria-label", "확인한 첨부파일");
              files.forEach(function (f) {
                if (!f || typeof f !== "object") return;
                var url = safeUrl(f.url);
                var name = str(f.name);
                if (!url || !name) return;
                var a = el("a", null, name + " ↗");
                a.href = url;
                a.target = "_blank";
                a.rel = "noreferrer";
                links.appendChild(a);
              });
              if (links.childNodes.length) sec.appendChild(links);
            }
            analysis.appendChild(sec);
          }

          if (str(n.qualificationRequirements)) {
            var qsec = el("section", "qualification");
            qsec.appendChild(el("h2", null, "참가 자격요건"));
            qsec.appendChild(el("p", null, n.qualificationRequirements));
            if (qualTags.length) {
              var tags = el("div", "tag-list");
              tags.setAttribute("aria-label", "자격요건 태그");
              qualTags.forEach(function (t) { tags.appendChild(el("span", null, t)); });
              qsec.appendChild(tags);
            }
            analysis.appendChild(qsec);
          }
          if (analysis.childNodes.length) main.appendChild(analysis);

          /* 원문 */
          var sourceUrl = safeUrl(n.sourceUrl);
          if (sourceUrl) {
            var box = el("div", "source-url-box");
            box.setAttribute("aria-label", "공고 원문 URL");
            box.appendChild(el("span", "source-url-label", "원문 URL"));
            var a = el("a", "source-url-text mono", sourceUrl);
            a.href = sourceUrl;
            a.target = "_blank";
            a.rel = "noreferrer";
            box.appendChild(a);
            main.appendChild(box);

            var actions = el("div", "notice-actions");
            var link = el("a", "source-link", (str(n.sourceName) || "나라장터") + " 원문 ↗");
            link.href = sourceUrl;
            link.target = "_blank";
            link.rel = "noreferrer";
            actions.appendChild(link);
            main.appendChild(actions);
          }

          /* 이 공고 공유 링크 — 누를 때마다 랜덤 토큰 주소가 새로 생성됨 */
          var share = el("div", "share");
          share.appendChild(el("h2", null, "이 공고 공유 링크"));
          share.appendChild(el("p", "share-note",
            "버튼을 누를 때마다 공고번호와 무관한 랜덤 주소가 새로 만들어집니다. 링크를 열면 로그인 없이 이 요약을 그대로 볼 수 있습니다."));
          var shareRow = el("div", "share-row");
          var linkBox = el("div", "share-link-box mono", "아직 만든 링크가 없습니다.");
          linkBox.setAttribute("aria-live", "polite");
          var shareBtn = el("button", "share-btn", "랜덤 링크 만들기 · 복사");
          shareBtn.type = "button";
          var resetTimer = null;
          shareBtn.addEventListener("click", function () {
            var link = buildShareLink(n);
            linkBox.textContent = link;
            copyText(link, function () {
              shareBtn.textContent = "복사됨 ✓";
              if (resetTimer) clearTimeout(resetTimer);
              resetTimer = setTimeout(function () { shareBtn.textContent = "랜덤 링크 만들기 · 복사"; }, 1800);
            });
          });
          shareRow.appendChild(linkBox);
          shareRow.appendChild(shareBtn);
          share.appendChild(shareRow);
          main.appendChild(share);

          main.appendChild(el("p", "provenance",
            "이 페이지는 나라장터 공고의 요약입니다. 요약은 공고 첨부문서를 분석해 작성됐으며, 정확한 내용은 위 원문에서 확인하세요."));

          document.title = n.title + " · 나라장터 공고 요약";
          return main;
        }

        function renderEmpty(isError) {
          var main = el("main");
          var box = el("div", "empty");
          box.appendChild(el("div", "empty-mark", "/"));
          box.appendChild(el("h1", null, isError ? "링크의 공고 정보를 읽지 못했어요" : "공유 링크로 여는 공고 요약 페이지예요"));
          box.appendChild(el("p", null, isError
            ? "링크가 잘렸거나 형식이 맞지 않습니다. 공유받은 링크 전체를 그대로 붙여넣어 다시 열어 주세요."
            : "이 주소에 공고 요약을 담은 링크로 들어오면, 로그인 없이 누구나 그 공고의 요약(제목·기관·금액·마감, 첨부파일 요약, 참가 자격요건)을 볼 수 있습니다."));
          main.appendChild(box);
          return main;
        }

        var payload = readPayload();
        var topHash = topLocationValue("hash");
        var topSearch = topLocationValue("search");
        var hadParam = /[#?&]d=/.test(window.location.href) || (window.location.hash || "").indexOf("#/p/") === 0
          || topHash.indexOf("#/p/") === 0 || /[#?&]d=/.test(topHash) || /[#?&]d=/.test(topSearch);
        var rendered = payload ? renderNotice(payload) : renderEmpty(hadParam);
        app.replaceWith(rendered);
        rendered.id = "app";
      })();
    </script>
  </body>
</html>
